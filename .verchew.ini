[Make]

cli = make
version = GNU Make

[Python]

cli = python
version = 3.14

[Poetry]

cli = poetry
version = 2

[PostgreSQL]

cli = psql
version = 14
optional = true
message = Required for local development.

[direnv]

cli = direnv
cli_version_arg = --help
version = direnv v2
optional = true
message = Required to manage environment variables.

[Graphviz]

cli = dot
cli_version_arg = -V
version = 12 || 14
optional = true
message = Required to generate UML diagrams: brew install graphviz

[Docker]

cli = docker
version = 28 || 29
optional = true
message = Required to test the production Docker container locally.
