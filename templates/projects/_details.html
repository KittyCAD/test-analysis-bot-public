<button type="button"
        class="btn btn-sm btn-outline-dark"
        data-bs-toggle="modal"
        data-bs-target="#details-{{ result.pk }}">
    <i class="fa-solid fa-maximize"></i>
</button>
<div class="modal fade" id="details-{{ result.pk }}" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Result Details</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <pre class="mb-0">{{ result.message }}</pre>
                {% if result.command %}
                    <div class="command-output bg-dark text-light rounded mt-4 p-3">
                        {% for line, copyable in result.command %}
                            <div class="d-flex align-items-center mb-1">
                                <pre class="mb-0 flex-grow-1 font-monospace"><code>{% if copyable %}<span class="text-success prompt">$ </span>{% endif %}{% if not copyable %}<span class="comment">{% endif %}{{ line }}{% if not copyable %}</span>{% endif %}</code></pre>
                                {% if copyable %}
                                    <button class="btn btn-sm btn-outline-secondary ms-2 copy-btn"
                                            data-clipboard-text="{{ line }}"
                                            title="Copy to clipboard">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                {% endif %}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
<style>
.prompt {
    user-select: none;
}
.comment {
    color: #6c757d;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const copyButtons = document.querySelectorAll('.copy-btn');
    copyButtons.forEach(button => {
        button.addEventListener('click', function() {
            const text = this.getAttribute('data-clipboard-text');
            navigator.clipboard.writeText(text).then(() => {
                const originalIcon = this.innerHTML;
                this.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => {
                    this.innerHTML = originalIcon;
                }, 1000);
            });
        });
    });
});
</script>
