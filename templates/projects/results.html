{% extends "base.html" %}

{% load django_tables2 %}
{% load static %}

{% block title %}
    {{ project.name }}
{% endblock title %}

{% block content %}
    <div class="container mt-4">
        <h1 class="mb-4">
            {{ project.name }}
            <a href="{% url 'projects:tests' project.path %}"
               class="btn btn-outline-primary ms-2"><i class="fa-solid fa-arrow-left"></i></a>
        </h1>
        {% render_table table %}
    </div>
{% endblock content %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/tables.css' %}">
    <style>
        /* Wrap text in the Test Name column */
        .table td:first-child {
            white-space: normal;
        }
        /* Wrap text in the Branch column */
        .table td:nth-child(3) {
            white-space: normal;
        }
    </style>
{% endblock extra_css %}
