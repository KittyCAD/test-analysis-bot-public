<div class="card shadow mt-4 border-info">
    <div class="card-header py-3 bg-info text-white">
        <h6 class="m-0 font-weight-bold">
            <i class="fa-solid fa-chart-line me-2"></i>
            Past Failure Rate
        </h6>
    </div>
    <div class="card-body">
        {% if history_data %}
            <div style="height: 300px;">
                <canvas id="failureRateChart"></canvas>
            </div>
        {% else %}
            <p class="text-muted mb-0">No test results available for the past week.</p>
        {% endif %}
    </div>
</div>
{% if history_data %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('failureRateChart');
        if (ctx) {
            const chartData = {
                labels: [{% for day_data in history_data %}'{{ day_data.date }}'{% if not forloop.last %}, {% endif %}{% endfor %}].map(dateStr => {
                    const date = new Date(dateStr);
                    return `${date.getMonth() + 1}/${date.getDate()}`;
                }),
                datasets: [{
                    data: [{% for day_data in history_data %}{{ day_data.failure_rate }}{% if not forloop.last %}, {% endif %}{% endfor %}],
                    borderColor: '#0dcaf0',
                    borderWidth: 2,
                    fill: false,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                }]
            };

            const config = {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    const dayIndex = context[0].dataIndex;
                                    const dayData = {{ history_data|safe }};
                                    const data = dayData[dayIndex];
                                    return data.date;
                                },
                                label: function(context) {
                                    const dayIndex = context.dataIndex;
                                    const dayData = {{ history_data|safe }};
                                    const data = dayData[dayIndex];
                                    return [
                                        `Failure Rate: ${data.failure_rate}%`,
                                        `Block Rate: ${data.block_rate}%`,
                                        `Avg Duration: ${data.average_duration}s`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxTicksLimit: 8, // show up to 8 day labels
                                callback: function(value, index) {
                                    return this.getLabelForValue(value);
                                }
                            }
                        }
                    }
                }
            };

            new Chart(ctx, config);
        }
    });
    </script>
{% endif %}
