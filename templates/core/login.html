{% extends "base.html" %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h3 mb-0">Login</h1>
                    </div>
                    <div class="card-body">
                        {% if authentik_enabled %}
                            <a href="{% url 'oidc_authentication_init' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}"
                               class="btn btn-primary w-100 mb-4">
                                <i class="fa-solid fa-right-to-bracket me-1"></i>
                                Continue with Authentik
                            </a>
                        {% endif %}
                        <p class="text-muted mb-4">
                            We'll send you a generated, one-time password to your email.
                            If you are an administrator, you can also login with your password.
                        </p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address:</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-paper-plane me-1"></i>
                                    Submit
                                </button>
                                <a href="{% url 'admin:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}"
                                   class="btn btn-outline-danger">
                                    <i class="fa-solid fa-table me-1"></i>
                                    Admin
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
