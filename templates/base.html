{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Test analysis and monitoring platform">
        <meta name="keywords" content="testing, analysis, monitoring, django">
        <title>
            {% block title %}
                Test Analysis Bot
            {% endblock title %}
        </title>
        <!-- Favicon -->
        <link rel="icon"
              type="image/png"
              href="{% static 'favicon/favicon-96x96.png' %}"
              sizes="96x96" />
        <link rel="icon"
              type="image/svg+xml"
              href="{% static 'favicon/favicon.svg' %}" />
        <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" />
        <link rel="apple-touch-icon"
              sizes="180x180"
              href="{% static 'favicon/apple-touch-icon.png' %}" />
        <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <!-- Custom -->
        {% block extra_css %}
        {% endblock extra_css %}
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="{% url 'projects:index' %}">
                    <img src="{% static 'favicon/favicon.svg' %}"
                         alt="Logo"
                         width="30"
                         height="30"
                         class="d-inline-block align-text-top me-2">
                    Test Analysis Bot
                </a>
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container">
            {% block content %}
            {% endblock content %}
        </main>
        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom -->
        {% block extra_js %}
        {% endblock extra_js %}
    </body>
</html>
